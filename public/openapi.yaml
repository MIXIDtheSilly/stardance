openapi: 3.0.3
info:
  title: Stardance API
  version: "1"
  description: |
    A read-only public API for Stardance projects, devlogs and the shop. You
    need an
    API key to use this! Go to your [account settings](/?settings=1) to get
    one.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Include your API key via `Authorization: Bearer YOUR_API_KEY`. You
        can find or regenerate your API key in your
        [account settings](/?settings=1).
  schemas:
    Project:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        ship_status: { type: string }
        repo_url: { type: string, nullable: true }
        demo_url: { type: string, nullable: true }
        readme_url: { type: string, nullable: true }
        ai_declaration: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        devlog_ids:
          type: array
          items: { type: integer }
        banner_url: { type: string, format: uri, nullable: true, description: Full-size banner image }
        banner_thumb_url: { type: string, format: uri, nullable: true, description: 400x210 webp thumbnail }
    Comment:
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        author:
          type: object
          properties:
            id: { type: integer }
            display_name: { type: string }
            avatar: { type: string, format: uri }
    Devlog:
      type: object
      properties:
        id: { type: integer }
        body: { type: string }
        duration_seconds: { type: integer, nullable: true, description: Time logged for this devlog }
        likes_count: { type: integer }
        comments_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        media:
          type: array
          description: Images and videos attached to the devlog
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              content_type: { type: string }
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
    RegionEnabled:
      type: object
      description: Whether the item is buyable in each region, after region fallbacks are applied
      properties:
        enabled_us: { type: boolean }
        enabled_eu: { type: boolean }
        enabled_uk: { type: boolean }
        enabled_in: { type: boolean }
        enabled_ca: { type: boolean }
        enabled_au: { type: boolean }
        enabled_xx: { type: boolean, description: Rest of world }
    TicketCost:
      type: object
      description: Ticket price per region, with any sale discount already applied
      properties:
        base_cost: { type: integer, nullable: true, description: Unadjusted ticket cost before regional offsets and sales }
        us: { type: integer }
        eu: { type: integer }
        uk: { type: integer }
        in: { type: integer }
        ca: { type: integer }
        au: { type: integer }
        xx: { type: integer }
    ShopItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        long_description: { type: string, nullable: true }
        type: { type: string, description: "Item class, e.g. ShopItem::WarehouseItem" }
        limited: { type: boolean, nullable: true }
        stock: { type: integer, nullable: true }
        max_qty: { type: integer, nullable: true }
        one_per_person_ever: { type: boolean, nullable: true }
        buyable_by_self: { type: boolean, nullable: true }
        show_in_carousel: { type: boolean, nullable: true }
        accessory_tag: { type: string, nullable: true }
        sale_percentage: { type: integer, nullable: true }
        agh_contents: { nullable: true, description: Contents of a grant item }
        old_prices:
          type: array
          description: Previous ticket costs, oldest first
          items: { type: integer }
        attached_shop_item_ids:
          type: array
          description: Accessory items that can be added to this one
          items: { type: integer }
        image_url: { type: string, format: uri, nullable: true, description: Full-size item image }
        image_thumb_url: { type: string, format: uri, nullable: true, description: 160px webp thumbnail }
        enabled: { $ref: "#/components/schemas/RegionEnabled" }
        ticket_cost: { $ref: "#/components/schemas/TicketCost" }
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        total_pages: { type: integer }
        total_count: { type: integer }
        next_page: { type: integer, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    page:
      name: page
      in: query
      required: false
      schema: { type: integer }
      description: Page number for pagination
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, maximum: 100 }
      description: Number of results per page (defaults to 25, max 100)
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Limit cannot exceed 100" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Invalid API key" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Resource not found" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
          example: { error: "rate_limited", message: "Too many requests. Please slow down." }
paths:
  /projects:
    get:
      summary: List projects
      tags: [ Projects ]
      description: "Fetch a list of projects. Ratelimit: 5 reqs/min, 20 reqs/min if searching."
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: query
          in: query
          required: false
          schema: { type: string }
          description: Search projects by title or description
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get a project
      tags: [ Projects ]
      description: "Fetch a specific project by ID. Ratelimit: 30 reqs/min."
      operationId: getProject
      responses:
        "200":
          description: A single project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /projects/{id}/devlogs:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: List project devlogs
      tags: [ Projects ]
      description: "Fetch a page of devlogs for a specific project, newest first. Ratelimit: 20 reqs/min."
      operationId: listProjectDevlogs
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of the project's devlogs
          content:
            application/json:
              schema:
                type: object
                properties:
                  devlogs:
                    type: array
                    items: { $ref: "#/components/schemas/Devlog" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /devlogs:
    get:
      summary: List devlogs
      tags: [ Devlogs ]
      description: "Fetch a page of devlogs across all projects, newest first. Ratelimit: 5 reqs/min."
      operationId: listDevlogs
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of devlogs
          content:
            application/json:
              schema:
                type: object
                properties:
                  devlogs:
                    type: array
                    items: { $ref: "#/components/schemas/Devlog" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /devlogs/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get a devlog
      tags: [ Devlogs ]
      description: "Fetch a specific devlog by ID. Ratelimit: 30 reqs/min."
      operationId: getDevlog
      responses:
        "200":
          description: A single devlog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Devlog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /shop:
    get:
      summary: List shop items
      tags: [ Shop ]
      description: "Fetch a page of the items currently listed in the shop. Ratelimit: 5 reqs/min."
      operationId: listShopItems
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of shop items
          content:
            application/json:
              schema:
                type: object
                properties:
                  shop_items:
                    type: array
                    items: { $ref: "#/components/schemas/ShopItem" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /shop/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get a shop item
      tags: [ Shop ]
      description: "Fetch a specific shop item by ID. Ratelimit: 30 reqs/min."
      operationId: getShopItem
      responses:
        "200":
          description: A single shop item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
