openapi: 3.0.3
info:
  title: Stardance API
  version: "1"
  description: |
    A read-only public API for Stardance projects and users. You need an API
    key to use this! Go to your [account settings](/?settings=1) to get one.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Include your API key via `Authorization: Bearer YOUR_API_KEY`. You
        can find or regenerate your API key in your
        [account settings](/?settings=1).
  schemas:
    Project:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        ship_status: { type: string }
        repo_url: { type: string, nullable: true }
        demo_url: { type: string, nullable: true }
        readme_url: { type: string, nullable: true }
        ai_declaration: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        devlog_ids:
          type: array
          items: { type: integer }
        banner_url: { type: string, format: uri, nullable: true, description: Full-size banner image }
        banner_thumb_url: { type: string, format: uri, nullable: true, description: 400x210 webp thumbnail }
    User:
      type: object
      properties:
        id: { type: integer }
        slack_id: { type: string, nullable: true }
        display_name: { type: string, nullable: true }
        avatar: { type: string, format: uri }
        project_ids:
          type: array
          items: { type: integer }
        stardust:
          type: integer
          nullable: true
          description: >-
            Current Stardust balance. Only disclosed for users who opted into
            the leaderboard, and for the authenticated user; null otherwise.
    Achievement:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            vote_count: { type: integer, nullable: true }
            like_count: { type: integer, description: Likes this user has given }
            devlog_seconds_total: { type: integer }
            devlog_seconds_today: { type: integer }
            achievements:
              type: array
              items: { $ref: "#/components/schemas/Achievement" }
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        total_pages: { type: integer }
        total_count: { type: integer }
        next_page: { type: integer, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    user_id:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: User ID, or "me" for the authenticated user
    page:
      name: page
      in: query
      required: false
      schema: { type: integer }
      description: Page number for pagination
    limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, maximum: 100 }
      description: Number of results per page (defaults to 25, max 100)
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Limit cannot exceed 100" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Invalid API key" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Resource not found" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
          example: { error: "rate_limited", message: "Too many requests. Please slow down." }
paths:
  /projects:
    get:
      summary: List projects
      tags: [ Projects ]
      description: "Fetch a list of projects. Ratelimit: 5 reqs/min, 20 reqs/min if searching."
      operationId: listProjects
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: query
          in: query
          required: false
          schema: { type: string }
          description: Search projects by title or description
      responses:
        "200":
          description: A page of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      summary: Get a project
      tags: [ Projects ]
      description: "Fetch a specific project by ID. Ratelimit: 30 reqs/min."
      operationId: getProject
      responses:
        "200":
          description: A single project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users:
    get:
      summary: List users
      tags: [ Users ]
      description: "Fetch a page of users. Ratelimit: 5 reqs/min."
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - name: query
          in: query
          required: false
          schema: { type: string }
          description: Search users by display name or Slack ID
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/user_id"
    get:
      summary: Get a user
      tags: [ Users ]
      description: "Fetch a specific user by ID, with their activity stats. Use \"me\" for the authenticated user. Ratelimit: 30 reqs/min."
      operationId: getUser
      responses:
        "200":
          description: A single user with additional stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/{id}/projects:
    parameters:
      - $ref: "#/components/parameters/user_id"
    get:
      summary: List projects for a user
      tags: [ Users ]
      description: "Fetch a page of projects belonging to a user. Use \"me\" for the authenticated user. Ratelimit: 20 reqs/min."
      operationId: listUserProjects
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: A page of the user's projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
